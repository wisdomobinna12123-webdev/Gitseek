<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GitSeek - GitHub finder</title>
    
    
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    
    
    
    
    
    
    
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="manifest" href="/site.webmanifest">
    
    
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    
    
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Exo+2&family=Rajdhani&family=Michroma&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    
    
     <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    
    <link rel="stylesheet" href="design.css">
</head>
<body>
    
    <header class="status">
        
        
    </header>
    
    
    
    <main>
    
    <div class="container">
        
        <div class="head">

    <h2>Git<span class="highlight">Seek</span></h2>
    
    <p>Your gateway to GitHub profiles.</p>
    
    </div>

    <div class="search">

        <input
            type="text"
            id="username"
            placeholder="Search a GitHub username..."
        >

        <button id="searchBtn">
            <i class="fa-solid fa-search"></i> 
        </button>


    </div>
    
    
    <div class="history">
        
        <div class="recents">
        
        <h3>Recent searches </h3>
        
        </div>
        
        <div class="history-list">
            
            
            
        </div>
        
        
        
    </div>
    
    
    
    
   <div class="load-cont">
   <div class="loader"></div>
   </div>
   
   

    <div class="profile-card">

        <img class="avatar">


        <h3 class="name"></h3>

        <p class="bio"></p>
        
        
        
        <div class="card-stats">
            
        <div class="sub-card">
        <h3>Followers
        <p class="followers"></p>
        </h3>
         </div>
         
         
         <div class="sub-card">
         <h3>Following
        <p class="following"></p>
          </h3>
          </div>
          
          
          <div class="sub-card">
          <h3>Repos
        <p class="repos"></p>
          </h3>
          </div>
          
          
        </div>
        
        
        
        <div class="githubLink">
        
        <a
    
    target="_blank"
    rel="noopener noreferrer"
>
    View GitHub profile 
</a>

    </div>

        
    </div>

</div>






<footer class="foot">&copy alrights reserved 2026

</footer>



</main>



<script src="design.js"></script>
    

</body>
</html>
